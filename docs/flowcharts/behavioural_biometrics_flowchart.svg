<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200">
    <defs>
        <style>
            .box {
                fill: #2c3e50;
                stroke: #ecf0f1;
                stroke-width: 2;
            }

            .decision {
                fill: #34495e;
                stroke: #ecf0f1;
                stroke-width: 2;
            }

            .process {
                fill: #16a085;
                stroke: #ecf0f1;
                stroke-width: 2;
            }

            .alert {
                fill: #e74c3c;
                stroke: #ecf0f1;
                stroke-width: 2;
            }

            .success {
                fill: #27ae60;
                stroke: #ecf0f1;
                stroke-width: 2;
            }

            .text {
                fill: #ecf0f1;
                font-family: Arial, sans-serif;
                font-size: 14px;
                text-anchor: middle;
            }

            .text-small {
                fill: #ecf0f1;
                font-family: Arial, sans-serif;
                font-size: 12px;
                text-anchor: middle;
            }

            .label {
                fill: #ecf0f1;
                font-family: Arial, sans-serif;
                font-size: 13px;
                font-weight: bold;
            }

            .arrow {
                stroke: #95a5a6;
                stroke-width: 2;
                fill: none;
                marker-end: url(#arrowhead);
            }

            .arrow-dashed {
                stroke: #95a5a6;
                stroke-width: 2;
                stroke-dasharray: 5,5;
                fill: none;
                marker-end: url(#arrowhead);
            }

            .arrow-label {
                fill: #bdc3c7;
                font-family: Arial, sans-serif;
                font-size: 12px;
                text-anchor: middle;
                font-weight: bold;
            }

            .section-label {
                fill: #7f8c8d;
                font-family: Arial, sans-serif;
                font-size: 16px;
                font-weight: bold;
                text-anchor: start;
            }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#95a5a6" />
        </marker>
    </defs>

    <!-- ================= COMMON START ================= -->

    <rect x="50" y="20" width="1500" height="50" class="box" />
    <text x="800" y="50" class="text" font-size="18" font-weight="bold">BEHAVIOURAL BIOMETRICS AUTHENTICATION FLOW</text>

    <!-- Login Input -->
    <rect x="600" y="100" width="400" height="70" class="box" />
    <text x="800" y="130" class="text">User Enters Login</text>
    <text x="800" y="150" class="text">Credentials</text>
    <path d="M 800 70 L 800 100" class="arrow" />

    <!-- Bank Validation -->
    <path d="M 800 200 L 950 250 L 800 300 L 650 250 Z" class="decision" />
    <text x="800" y="245" class="text">Bank Credentials</text>
    <text x="800" y="265" class="text">Validated?</text>
    <path d="M 800 170 L 800 200" class="arrow" />

    <!-- Validation Fail -->
    <rect x="350" y="230" width="150" height="40" class="alert" />
    <text x="425" y="255" class="text">Login Failed</text>
    <path d="M 650 250 L 500 250" class="arrow" />
    <text x="580" y="240" class="arrow-label">NO</text>

    <!-- Validation Success -->
    <path d="M 950 250 L 1050 250 L 1050 300 L 800 300 L 800 330" class="arrow" />
    <text x="980" y="240" class="arrow-label">YES</text>

    <!-- MoneyGuard Session Start -->
    <rect x="650" y="330" width="300" height="60" class="process" />
    <text x="800" y="355" class="text">MoneyGuard SDK</text>
    <text x="800" y="375" class="text">Session Started</text>

    <!-- ================= THE SPLIT ================= -->
    <!-- Decision: Is Device Known? -->
    <path d="M 800 430 L 950 480 L 800 530 L 650 480 Z" class="decision" />
    <text x="800" y="475" class="text">Is Device</text>
    <text x="800" y="495" class="text">Known/Registered?</text>
    <path d="M 800 390 L 800 430" class="arrow" />

    <!-- Labels for branches -->
    <text x="450" y="460" class="arrow-label">YES (Standard Flow)</text>
    <text x="1150" y="460" class="arrow-label">NO (New Device Flow)</text>

    <!-- ================= LEFT BRANCH: STANDARD FLOW ================= -->
    <!-- Connect to Enrolled Decision -->
    <path d="M 650 480 L 550 480 L 550 550" class="arrow" />

    <!-- Is User Enrolled? -->
    <path d="M 550 550 L 670 600 L 550 650 L 430 600 Z" class="decision" />
    <text x="550" y="595" class="text-small">Is User Enrolled</text>
    <text x="550" y="610" class="text-small">for Biometrics?</text>

    <!-- Not Enrolled (Go Left) -->
    <path d="M 430 600 L 250 600 L 250 680" class="arrow" />
    <text x="340" y="590" class="arrow-label">NO</text>

    <!-- Enrolled (Go Down) -->
    <path d="M 550 650 L 550 680" class="arrow" />
    <text x="570" y="665" class="arrow-label">YES</text>

    <!-- SUB-BRANCH: Enrollment Mode -->
    <rect x="50" y="680" width="400" height="60" class="process" />
    <text x="250" y="705" class="text" font-weight="bold">ENROLLMENT MODE</text>
    <text x="250" y="725" class="text">(Background Process)</text>

    <rect x="50" y="770" width="400" height="60" class="box" />
    <text x="250" y="795" class="text">Save Behavioural Biometrics</text>
    <text x="250" y="815" class="text">for Enrollment</text>
    <path d="M 250 740 L 250 770" class="arrow" />

    <rect x="50" y="860" width="400" height="60" class="success" />
    <text x="250" y="885" class="text">Toast: "Data Captured"</text>
    <text x="250" y="905" class="text-small">(Silent Enrollment)</text>
    <path d="M 250 830 L 250 860" class="arrow" />

    <!-- SUB-BRANCH: Verification Mode (Invisible) -->
    <rect x="450" y="680" width="300" height="60" class="process" />
    <text x="600" y="705" class="text" font-weight="bold">VERIFICATION MODE</text>
    <text x="600" y="725" class="text">(Invisible Check)</text>

    <rect x="450" y="770" width="300" height="60" class="box" />
    <text x="600" y="795" class="text">Verify Against</text>
    <text x="600" y="815" class="text">Stored Profile</text>
    <path d="M 600 740 L 600 770" class="arrow" />

    <!-- Decision: Pattern Match? -->
    <path d="M 600 860 L 700 910 L 600 960 L 500 910 Z" class="decision" />
    <text x="600" y="915" class="text-small">Match?</text>
    <path d="M 600 830 L 600 860" class="arrow" />

    <!-- Match Success -->
    <rect x="450" y="1000" width="200" height="60" class="success" />
    <text x="550" y="1025" class="text">Toast: "Verified ✓"</text>
    <text x="550" y="1045" class="text-small">Seamless Login</text>
    <path d="M 600 960 L 600 980 L 550 980 L 550 1000" class="arrow" />
    <text x="560" y="970" class="arrow-label">YES</text>

    <!-- Match Fail (Fraud) -->
    <rect x="660" y="1000" width="140" height="150" class="alert" />
    <text x="730" y="1030" class="text-small" font-weight="bold">FRAUD</text>
    <text x="730" y="1050" class="text-small" font-weight="bold">DETECTED</text>
    <text x="730" y="1080" class="text-small" font-size="10">Warning Dialog</text>
    <text x="730" y="1100" class="text-small" font-size="10">Block Access</text>
    <path d="M 700 910 L 730 910 L 730 1000" class="arrow" />
    <text x="735" y="905" class="arrow-label">NO</text>

    <!-- ================= RIGHT BRANCH: NEW DEVICE FLOW ================= -->
    <!-- Connect from Top Decision -->
    <path d="M 950 480 L 1200 480 L 1200 550" class="arrow" />

    <!-- Show Dialog -->
    <rect x="1000" y="550" width="400" height="80" class="box" />
    <text x="1200" y="580" class="text">Show Dialog:</text>
    <text x="1200" y="600" class="text">"Device Verification Required"</text>

    <!-- Navigate to Bio Screen -->
    <rect x="1000" y="660" width="400" height="60" class="process" />
    <text x="1200" y="685" class="text" font-weight="bold">EXPLICIT VERIFICATION</text>
    <text x="1200" y="705" class="text">Navigate to Bio Screen</text>
    <path d="M 1200 630 L 1200 660" class="arrow" />

    <!-- User Input -->
    <rect x="1000" y="750" width="400" height="60" class="box" />
    <text x="1200" y="775" class="text">User Types Required</text>
    <text x="1200" y="795" class="text">Text / Username</text>
    <path d="M 1200 720 L 1200 750" class="arrow" />

    <!-- Verify Input -->
    <rect x="1000" y="840" width="400" height="60" class="box" />
    <text x="1200" y="865" class="text">Verify Behavioural Biometrics</text>
    <text x="1200" y="885" class="text">Against Profile</text>
    <path d="M 1200 810 L 1200 840" class="arrow" />

    <!-- Explicit Match Decision -->
    <path d="M 1200 930 L 1320 980 L 1200 1030 L 1080 980 Z" class="decision" />
    <text x="1200" y="985" class="text-small">Match?</text>
    <path d="M 1200 900 L 1200 930" class="arrow" />

    <!-- Explicit Success -->
    <rect x="950" y="1060" width="200" height="100" class="success" />
    <text x="1050" y="1090" class="text" font-weight="bold">✓ Verified!</text>
    <text x="1050" y="1115" class="text-small">• Trust New Device</text>
    <text x="1050" y="1135" class="text-small">• Grant Access</text>
    <path d="M 1080 980 L 1050 980 L 1050 1060" class="arrow" />
    <text x="1040" y="975" class="arrow-label">YES</text>

    <!-- Explicit Fail -->
    <rect x="1250" y="1060" width="200" height="100" class="alert" />
    <text x="1350" y="1090" class="text" font-weight="bold">✗ Failed</text>
    <text x="1350" y="1115" class="text-small">• Block Login</text>
    <text x="1350" y="1135" class="text-small">• Security Alert</text>
    <path d="M 1320 980 L 1350 980 L 1350 1060" class="arrow" />
    <text x="1360" y="975" class="arrow-label">NO</text>

    <!-- ================= CONVERGENCE ================= -->
    <!-- Continue Box -->
    <rect x="500" y="1250" width="600" height="80" class="box" />
    <text x="800" y="1285" class="text">Continue to Next</text>
    <text x="800" y="1305" class="text">Security Checks</text>

    <!-- Paths to Continue -->
    <path d="M 250 920 L 250 1200 L 800 1200 L 800 1250" class="arrow" /> <!-- From Enrollment -->
    <path d="M 550 1060 L 550 1200 L 800 1200" class="arrow" /> <!-- From Invisible Success -->
    <path d="M 1050 1160 L 1050 1200 L 800 1200" class="arrow" /> <!-- From New Device Success -->
    <!-- Dashboard -->
    <rect x="600" y="1370" width="400" height="60" class="success" />
    <text x="800" y="1395" class="text" font-weight="bold">Navigate to</text>
    <text x="800" y="1415" class="text" font-weight="bold">Dashboard</text>
    <path d="M 800 1330 L 800 1370" class="arrow" />

</svg>