<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600">
  <defs>
    <style>
      .box { fill: #2c3e50; stroke: #ecf0f1; stroke-width: 2; }
      .decision { fill: #34495e; stroke: #ecf0f1; stroke-width: 2; }
      .process { fill: #16a085; stroke: #ecf0f1; stroke-width: 2; }
      .alert { fill: #e74c3c; stroke: #ecf0f1; stroke-width: 2; }
      .success { fill: #27ae60; stroke: #ecf0f1; stroke-width: 2; }
      .text { fill: #ecf0f1; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { fill: #ecf0f1; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #95a5a6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: #bdc3c7; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6" />
    </marker>
  </defs>

  <!-- Title -->
  <rect x="50" y="20" width="800" height="50" class="box"/>
  <text x="450" y="50" class="text" font-size="18" font-weight="bold">USER LOGS IN FROM NEW DEVICE</text>

  <!-- User Enters Correct Credentials -->
  <rect x="275" y="110" width="350" height="60" class="box"/>
  <text x="450" y="135" class="text">User Enters Correct</text>
  <text x="450" y="155" class="text">Credentials</text>
  <path d="M 450 70 L 450 110" class="arrow"/>

  <!-- System Detects: Different Device -->
  <rect x="250" y="210" width="400" height="80" class="box"/>
  <text x="450" y="240" class="text">System Detects:</text>
  <text x="450" y="260" class="text">"Different Device</text>
  <text x="450" y="280" class="text">than Registered"</text>
  <path d="M 450 170 L 450 210" class="arrow"/>

  <!-- Show Dialog: Device Verification Required -->
  <rect x="225" y="330" width="450" height="120" class="box"/>
  <text x="450" y="360" class="text">Show Dialog:</text>
  <text x="450" y="380" class="text">"Device Verification</text>
  <text x="450" y="400" class="text">Required"</text>
  <text x="450" y="430" class="text-small">[Proceed to</text>
  <text x="450" y="445" class="text-small">Verification]</text>
  <path d="M 450 290 L 450 330" class="arrow"/>

  <!-- Navigate to Behavioural Biometrics Verification Screen -->
  <rect x="200" y="490" width="500" height="80" class="box"/>
  <text x="450" y="520" class="text">Navigate to Behavioural</text>
  <text x="450" y="540" class="text">Biometrics Verification</text>
  <text x="450" y="560" class="text">Screen</text>
  <path d="M 450 450 L 450 490" class="arrow"/>

  <!-- User Types Required Text/Username -->
  <rect x="250" y="610" width="400" height="60" class="box"/>
  <text x="450" y="635" class="text">User Types Required</text>
  <text x="450" y="655" class="text">Text/Username</text>
  <path d="M 450 570 L 450 610" class="arrow"/>

  <!-- Verify Behavioural Biometrics Against Profile -->
  <rect x="200" y="710" width="500" height="60" class="box"/>
  <text x="450" y="735" class="text">Verify Behavioural Biometrics</text>
  <text x="450" y="755" class="text">Against Profile</text>
  <path d="M 450 670 L 450 710" class="arrow"/>

  <!-- Split arrows for MATCH and NO MATCH -->
  <path d="M 450 770 L 250 820" class="arrow"/>
  <path d="M 450 770 L 650 820" class="arrow"/>
  <text x="320" y="810" class="arrow-label">MATCH</text>
  <text x="580" y="810" class="arrow-label">NO MATCH</text>

  <!-- MATCH - Success Box -->
  <rect x="50" y="820" width="350" height="140" class="success"/>
  <text x="225" y="850" class="text" font-weight="bold">✓ Verified!</text>
  <text x="225" y="880" class="text-small">• Trust New Device</text>
  <text x="225" y="905" class="text-small">• Grant Access</text>
  <path d="M 225 960 L 225 1020" class="arrow"/>

  <!-- NO MATCH - Failure Box -->
  <rect x="500" y="820" width="350" height="140" class="alert"/>
  <text x="675" y="850" class="text" font-weight="bold">✗ Verification Failed</text>
  <text x="675" y="880" class="text-small">• Block Login</text>
  <text x="675" y="905" class="text-small">• Security Alert</text>

  <!-- Navigate to Dashboard -->
  <rect x="125" y="1020" width="200" height="60" class="success"/>
  <text x="225" y="1045" class="text" font-weight="bold">Navigate to</text>
  <text x="225" y="1065" class="text" font-weight="bold">Dashboard</text>

</svg>

