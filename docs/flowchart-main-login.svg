<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2400" style="background-color: white;">
  <defs>
    <style>
      .box { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 2; }
      .decision { fill: #F5A623; stroke: #C77E0A; stroke-width: 2; }
      .success { fill: #7ED321; stroke: #5FA619; stroke-width: 2; }
      .warning { fill: #F44336; stroke: #C62828; stroke-width: 2; }
      .process { fill: #9B59B6; stroke: #7D3C98; stroke-width: 2; }
      .text { fill: white; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #333; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" style="font-size: 20px; font-weight: bold; text-anchor: middle; fill: #333;">Behavioral Biometrics - Main Login Flow</text>
  
  <!-- User Opens App -->
  <rect x="250" y="60" width="300" height="60" rx="10" class="box"/>
  <text x="400" y="95" class="text">USER OPENS APP</text>
  
  <!-- Arrow -->
  <path d="M 400 120 L 400 150" class="arrow"/>
  
  <!-- Enter Credentials -->
  <rect x="250" y="150" width="300" height="70" rx="10" class="box"/>
  <text x="400" y="175" class="text">User Enters Login</text>
  <text x="400" y="195" class="text">Credentials (Username</text>
  <text x="400" y="215" class="text">& Password)</text>
  
  <!-- Arrow -->
  <path d="M 400 220 L 400 250" class="arrow"/>
  
  <!-- Typing Pattern Captured -->
  <rect x="250" y="250" width="300" height="60" rx="10" class="process"/>
  <text x="400" y="275" class="text">Typing Pattern Captured</text>
  <text x="400" y="295" class="text">(Invisible to User)</text>
  
  <!-- Arrow -->
  <path d="M 400 310 L 400 340" class="arrow"/>
  
  <!-- Credentials Validated Decision -->
  <path d="M 400 340 L 480 390 L 400 440 L 320 390 Z" class="decision"/>
  <text x="400" y="385" class="text">Bank</text>
  <text x="400" y="405" class="text">Credentials</text>
  <text x="400" y="425" class="text">Valid?</text>
  
  <!-- NO Path -->
  <path d="M 320 390 L 200 390 L 200 480" class="arrow"/>
  <text x="250" y="385" class="label">NO</text>
  
  <!-- Login Failed -->
  <rect x="100" y="480" width="200" height="50" rx="10" class="warning"/>
  <text x="200" y="510" class="text">Login Failed</text>
  
  <!-- YES Path -->
  <path d="M 480 390 L 600 390 L 600 480" class="arrow"/>
  <text x="550" y="385" class="label">YES</text>
  
  <!-- MoneyGuard Registration -->
  <rect x="500" y="480" width="200" height="60" rx="10" class="box"/>
  <text x="600" y="505" class="text">MoneyGuard SDK</text>
  <text x="600" y="525" class="text">Registration</text>
  
  <!-- Arrow back to center -->
  <path d="M 600 540 L 600 580 L 400 580" class="arrow"/>
  
  <!-- Is User Enrolled Decision -->
  <path d="M 400 580 L 480 630 L 400 680 L 320 630 Z" class="decision"/>
  <text x="400" y="620" class="text">Is User</text>
  <text x="400" y="640" class="text">Enrolled?</text>
  <text x="400" y="660" class="text-small">(Typing Pattern)</text>
  
  <!-- NO Path - Enrollment -->
  <path d="M 320 630 L 150 630" class="arrow"/>
  <text x="220" y="625" class="label">NO</text>
  
  <!-- ENROLLMENT MODE -->
  <rect x="20" y="750" width="260" height="70" rx="10" class="process"/>
  <text x="150" y="775" class="text" style="font-weight: bold;">ENROLLMENT MODE</text>
  <text x="150" y="795" class="text-small">(Background Process)</text>
  <text x="150" y="815" class="text-small">Non-Blocking</text>
  
  <!-- Arrow down -->
  <path d="M 150 630 L 150 750" class="arrow"/>
  
  <!-- Save Typing Pattern -->
  <rect x="40" y="850" width="220" height="60" rx="10" class="box"/>
  <text x="150" y="875" class="text">Save Typing Pattern</text>
  <text x="150" y="895" class="text">for Enrollment</text>
  
  <!-- Arrow -->
  <path d="M 150 820 L 150 850" class="arrow"/>
  
  <!-- Enrollment Progress -->
  <rect x="40" y="940" width="220" height="80" rx="10" class="box"/>
  <text x="150" y="965" class="text-small">Enrollment Progress:</text>
  <text x="150" y="985" class="text-small">• 1st Login: 1/3</text>
  <text x="150" y="1005" class="text-small">• 2nd Login: 2/3</text>
  <text x="150" y="1025" class="text-small">• 3rd Login: Complete</text>
  
  <!-- Arrow -->
  <path d="M 150 910 L 150 940" class="arrow"/>
  
  <!-- Enrollment Toast -->
  <rect x="40" y="1050" width="220" height="70" rx="10" class="success"/>
  <text x="150" y="1075" class="text-small">Show Toast Message:</text>
  <text x="150" y="1095" class="text-small">"Behavioral Biometrics</text>
  <text x="150" y="1115" class="text-small">data captured"</text>
  
  <!-- Arrow -->
  <path d="M 150 1020 L 150 1050" class="arrow"/>
  
  <!-- YES Path - Verification -->
  <path d="M 480 630 L 650 630" class="arrow"/>
  <text x="580" y="625" class="label">YES</text>
  
  <!-- VERIFICATION MODE -->
  <rect x="520" y="750" width="260" height="70" rx="10" class="process"/>
  <text x="650" y="775" class="text" style="font-weight: bold;">VERIFICATION MODE</text>
  <text x="650" y="795" class="text-small">(Identity Check)</text>
  <text x="650" y="815" class="text-small">Blocking on Failure</text>
  
  <!-- Arrow down -->
  <path d="M 650 630 L 650 750" class="arrow"/>
  
  <!-- Verify Typing Pattern -->
  <rect x="540" y="850" width="220" height="60" rx="10" class="box"/>
  <text x="650" y="875" class="text">Verify Typing Pattern</text>
  <text x="650" y="895" class="text">Against Stored Profile</text>
  
  <!-- Arrow -->
  <path d="M 650 820 L 650 850" class="arrow"/>
  
  <!-- Pattern Match Decision -->
  <path d="M 650 940 L 720 980 L 650 1020 L 580 980 Z" class="decision"/>
  <text x="650" y="975" class="text">Does</text>
  <text x="650" y="995" class="text">Pattern</text>
  <text x="650" y="1015" class="text-small">Match?</text>
  
  <!-- Arrow -->
  <path d="M 650 910 L 650 940" class="arrow"/>
  
  <!-- YES - Success -->
  <path d="M 580 980 L 450 980" class="arrow"/>
  <text x="500" y="975" class="label">YES</text>
  
  <!-- Success Toast -->
  <rect x="300" y="1050" width="220" height="70" rx="10" class="success"/>
  <text x="410" y="1075" class="text-small">Show Success Toast:</text>
  <text x="410" y="1095" class="text-small">"Behavioral Biometrics</text>
  <text x="410" y="1115" class="text-small">verified successfully ✓"</text>
  
  <!-- Arrow -->
  <path d="M 410 980 L 410 1050" class="arrow"/>
  
  <!-- NO - Fraud Detected -->
  <path d="M 720 980 L 650 980 L 650 1050" class="arrow"/>
  <text x="740" y="975" class="label">NO</text>
  
  <!-- Fraud Warning -->
  <rect x="540" y="1050" width="220" height="60" rx="10" class="warning"/>
  <text x="650" y="1075" class="text" style="font-weight: bold;">FRAUD DETECTED!</text>
  <text x="650" y="1095" class="text-small">Show Warning Dialog</text>
  
  <!-- Verification Failed Dialog -->
  <rect x="540" y="1140" width="220" height="120" rx="10" class="warning"/>
  <text x="650" y="1165" class="text-small">"Typing Pattern</text>
  <text x="650" y="1185" class="text-small">Verification Failed</text>
  <text x="650" y="1205" class="text-small">This may indicate</text>
  <text x="650" y="1225" class="text-small">unauthorized access"</text>
  <text x="650" y="1250" class="text-small">[Proceed Anyway]</text>
  
  <!-- Arrow -->
  <path d="M 650 1110 L 650 1140" class="arrow"/>
  
  <!-- Converging paths -->
  <path d="M 150 1120 L 150 1350 L 400 1350" class="arrow"/>
  <path d="M 410 1120 L 410 1350 L 400 1350" class="arrow"/>
  <path d="M 650 1260 L 650 1350 L 400 1350" class="arrow"/>
  
  <!-- Continue to Next Security Check -->
  <rect x="250" y="1350" width="300" height="80" rx="10" class="box"/>
  <text x="400" y="1375" class="text">Continue to Next</text>
  <text x="400" y="1395" class="text">Security Check:</text>
  <text x="400" y="1415" class="text-small">• Credential Check</text>
  <text x="400" y="1430" class="text-small">• Location Check</text>
  
  <!-- Arrow -->
  <path d="M 400 1430 L 400 1460" class="arrow"/>
  
  <!-- Navigate to Dashboard -->
  <rect x="250" y="1460" width="300" height="60" rx="10" class="success"/>
  <text x="400" y="1485" class="text" style="font-size: 16px; font-weight: bold;">Navigate to</text>
  <text x="400" y="1505" class="text" style="font-size: 16px; font-weight: bold;">Dashboard</text>
  
  <!-- Legend -->
  <g transform="translate(50, 1600)">
    <text x="0" y="0" style="font-size: 16px; font-weight: bold; fill: #333;">Legend:</text>
    
    <rect x="0" y="20" width="80" height="30" rx="5" class="box"/>
    <text x="90" y="40" style="font-size: 12px; fill: #333; text-anchor: start;">User Action / Process</text>
    
    <rect x="0" y="60" width="80" height="30" rx="5" class="process"/>
    <text x="90" y="80" style="font-size: 12px; fill: #333; text-anchor: start;">SDK Operation</text>
    
    <path d="M 40 110 L 60 130 L 40 150 L 20 130 Z" class="decision"/>
    <text x="90" y="135" style="font-size: 12px; fill: #333; text-anchor: start;">Decision Point</text>
    
    <rect x="0" y="160" width="80" height="30" rx="5" class="success"/>
    <text x="90" y="180" style="font-size: 12px; fill: #333; text-anchor: start;">Success / Continue</text>
    
    <rect x="0" y="200" width="80" height="30" rx="5" class="warning"/>
    <text x="90" y="220" style="font-size: 12px; fill: #333; text-anchor: start;">Warning / Error</text>
  </g>
  
</svg>



