<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" style="background-color: white;">
  <defs>
    <style>
      .box { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 2; }
      .decision { fill: #F5A623; stroke: #C77E0A; stroke-width: 2; }
      .success { fill: #7ED321; stroke: #5FA619; stroke-width: 2; }
      .warning { fill: #F44336; stroke: #C62828; stroke-width: 2; }
      .process { fill: #9B59B6; stroke: #7D3C98; stroke-width: 2; }
      .info { fill: #03A9F4; stroke: #0277BD; stroke-width: 2; }
      .text { fill: white; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #333; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" style="font-size: 20px; font-weight: bold; text-anchor: middle; fill: #333;">Cross-Device Login with Trusted Device Verification</text>
  
  <!-- User Logs in from New Device -->
  <rect x="250" y="60" width="300" height="60" rx="10" class="info"/>
  <text x="400" y="85" class="text" style="font-weight: bold;">USER LOGS IN FROM</text>
  <text x="400" y="105" class="text" style="font-weight: bold;">NEW DEVICE</text>
  
  <!-- Arrow -->
  <path d="M 400 120 L 400 150" class="arrow"/>
  
  <!-- Enter Correct Credentials -->
  <rect x="250" y="150" width="300" height="60" rx="10" class="box"/>
  <text x="400" y="175" class="text">User Enters Correct</text>
  <text x="400" y="195" class="text">Credentials</text>
  
  <!-- Arrow -->
  <path d="M 400 210 L 400 240" class="arrow"/>
  
  <!-- System Detects Different Device -->
  <rect x="250" y="240" width="300" height="70" rx="10" class="warning"/>
  <text x="400" y="265" class="text">System Detects:</text>
  <text x="400" y="285" class="text">"Different Device</text>
  <text x="400" y="305" class="text">than Registered"</text>
  
  <!-- Arrow -->
  <path d="M 400 310 L 400 340" class="arrow"/>
  
  <!-- Show Device Verification Dialog -->
  <rect x="200" y="340" width="400" height="140" rx="10" class="warning"/>
  <text x="400" y="365" class="text" style="font-weight: bold;">Show Dialog:</text>
  <text x="400" y="390" class="text-small">"Device Verification Required"</text>
  <text x="400" y="410" class="text-small">You are logging in from a different device</text>
  <text x="400" y="430" class="text-small">than where MoneyGuard was initially installed.</text>
  <text x="400" y="450" class="text-small">For your security, we need to verify your identity.</text>
  <text x="400" y="470" class="text">[Proceed to Verification]</text>
  
  <!-- Arrow -->
  <path d="M 400 480 L 400 510" class="arrow"/>
  
  <!-- Navigate to Verification Screen -->
  <rect x="250" y="510" width="300" height="60" rx="10" class="box"/>
  <text x="400" y="535" class="text">Navigate to Typing Pattern</text>
  <text x="400" y="555" class="text">Verification Screen</text>
  
  <!-- Arrow -->
  <path d="M 400 570 L 400 600" class="arrow"/>
  
  <!-- Prompt User to Type -->
  <rect x="200" y="600" width="400" height="80" rx="10" class="info"/>
  <text x="400" y="625" class="text">Prompt User to Type:</text>
  <text x="400" y="645" class="text" style="font-style: italic;">"hello, my name is [FirstName]"</text>
  <text x="400" y="670" class="text-small">(or username based on configuration)</text>
  
  <!-- Arrow -->
  <path d="M 400 680 L 400 710" class="arrow"/>
  
  <!-- User Types Required Text -->
  <rect x="250" y="710" width="300" height="60" rx="10" class="box"/>
  <text x="400" y="735" class="text">User Types Required</text>
  <text x="400" y="755" class="text">Text in Input Field</text>
  
  <!-- Arrow -->
  <path d="M 400 770 L 400 800" class="arrow"/>
  
  <!-- User Clicks Verify -->
  <rect x="250" y="800" width="300" height="50" rx="10" class="box"/>
  <text x="400" y="830" class="text">User Clicks [Verify] Button</text>
  
  <!-- Arrow -->
  <path d="M 400 850 L 400 880" class="arrow"/>
  
  <!-- Verify Typing Pattern -->
  <rect x="250" y="880" width="300" height="60" rx="10" class="process"/>
  <text x="400" y="905" class="text">Verify Typing Pattern</text>
  <text x="400" y="925" class="text">Against Profile</text>
  
  <!-- Arrow -->
  <path d="M 400 940 L 400 970" class="arrow"/>
  
  <!-- Pattern Match Decision -->
  <path d="M 400 970 L 480 1020 L 400 1070 L 320 1020 Z" class="decision"/>
  <text x="400" y="1015" class="text">Pattern</text>
  <text x="400" y="1035" class="text">Match?</text>
  
  <!-- MATCH Path -->
  <path d="M 320 1020 L 150 1020" class="arrow"/>
  <text x="220" y="1015" class="label">MATCH</text>
  
  <!-- SUCCESS Block -->
  <rect x="20" y="1100" width="260" height="180" rx="10" class="success"/>
  <text x="150" y="1125" class="text" style="font-size: 16px; font-weight: bold;">✓ SUCCESS!</text>
  <text x="150" y="1155" class="text-small">Show Dialog:</text>
  <text x="150" y="1175" class="text-small">"Verification Successful"</text>
  <text x="150" y="1195" class="text-small">"Your identity has been verified"</text>
  <text x="150" y="1220" class="text-small" style="font-weight: bold;">Actions:</text>
  <text x="150" y="1240" class="text-small">• Trust New Device</text>
  <text x="150" y="1260" class="text-small">• Grant Full Access</text>
  
  <!-- Arrow -->
  <path d="M 150 1020 L 150 1100" class="arrow"/>
  
  <!-- NO MATCH Path -->
  <path d="M 480 1020 L 650 1020" class="arrow"/>
  <text x="580" y="1015" class="label">NO MATCH</text>
  
  <!-- FAILURE Block -->
  <rect x="520" y="1100" width="260" height="200" rx="10" class="warning"/>
  <text x="650" y="1125" class="text" style="font-size: 16px; font-weight: bold;">✗ FAILURE</text>
  <text x="650" y="1155" class="text-small">Show Dialog:</text>
  <text x="650" y="1175" class="text-small">"Verification Failed"</text>
  <text x="650" y="1195" class="text-small">"Your typing pattern could not</text>
  <text x="650" y="1215" class="text-small">be verified"</text>
  <text x="650" y="1240" class="text-small" style="font-weight: bold;">Options:</text>
  <text x="650" y="1260" class="text-small">• [Retry] - Try again</text>
  <text x="650" y="1280" class="text-small">• [Close] - Exit</text>
  
  <!-- Arrow -->
  <path d="M 650 1020 L 650 1100" class="arrow"/>
  
  <!-- If Closed -->
  <rect x="540" y="1320" width="220" height="70" rx="10" class="warning"/>
  <text x="650" y="1345" class="text-small" style="font-weight: bold;">If [Close] selected:</text>
  <text x="650" y="1365" class="text-small">• Block Login</text>
  <text x="650" y="1385" class="text-small">• Log Security Event</text>
  
  <!-- Arrow -->
  <path d="M 650 1300 L 650 1320" class="arrow"/>
  
  <!-- Device Marked as Trusted -->
  <rect x="50" y="1310" width="200" height="50" rx="10" class="success"/>
  <text x="150" y="1340" class="text">Device Marked as Trusted</text>
  
  <!-- Arrow -->
  <path d="M 150 1280 L 150 1310" class="arrow"/>
  
  <!-- Navigate to Dashboard -->
  <rect x="50" y="1390" width="200" height="60" rx="10" class="success"/>
  <text x="150" y="1415" class="text" style="font-weight: bold;">Navigate to</text>
  <text x="150" y="1435" class="text" style="font-weight: bold;">Dashboard</text>
  
  <!-- Arrow -->
  <path d="M 150 1360 L 150 1390" class="arrow"/>
  
  <!-- Benefits Box -->
  <g transform="translate(50, 1500)">
    <rect x="0" y="0" width="700" height="180" rx="10" style="fill: #E8F5E9; stroke: #4CAF50; stroke-width: 2;"/>
    <text x="350" y="25" style="font-size: 16px; font-weight: bold; fill: #2E7D32; text-anchor: middle;">Key Benefits of Cross-Device Verification</text>
    
    <text x="30" y="55" style="font-size: 13px; fill: #1B5E20; text-anchor: start;">✓ Prevents Account Takeover:</text>
    <text x="50" y="75" style="font-size: 12px; fill: #333; text-anchor: start;">Even with correct credentials, fraudster cannot access account from new device</text>
    
    <text x="30" y="100" style="font-size: 13px; fill: #1B5E20; text-anchor: start;">✓ One-Time Friction:</text>
    <text x="50" y="120" style="font-size: 12px; fill: #333; text-anchor: start;">Legitimate user verifies once per device, then seamless login thereafter</text>
    
    <text x="30" y="145" style="font-size: 13px; fill: #1B5E20; text-anchor: start;">✓ Multi-Device Support:</text>
    <text x="50" y="165" style="font-size: 12px; fill: #333; text-anchor: start;">Users can securely add phones, tablets, and other devices to their trusted list</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 1730)">
    <text x="0" y="0" style="font-size: 14px; font-weight: bold; fill: #333;">Legend:</text>
    
    <rect x="0" y="10" width="60" height="25" rx="5" class="info"/>
    <text x="70" y="27" style="font-size: 11px; fill: #333; text-anchor: start;">New Device Context</text>
    
    <rect x="200" y="10" width="60" height="25" rx="5" class="box"/>
    <text x="270" y="27" style="font-size: 11px; fill: #333; text-anchor: start;">User Action</text>
    
    <rect x="370" y="10" width="60" height="25" rx="5" class="process"/>
    <text x="440" y="27" style="font-size: 11px; fill: #333; text-anchor: start;">SDK Operation</text>
    
    <rect x="560" y="10" width="60" height="25" rx="5" class="success"/>
    <text x="630" y="27" style="font-size: 11px; fill: #333; text-anchor: start;">Success</text>
  </g>
  
</svg>



